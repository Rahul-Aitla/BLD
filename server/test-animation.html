<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f1a; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; width: 100vw; height: 100vh; }
  .box { width: 100px; height: 100px; background: linear-gradient(135deg, #e94560, #ff6b6b); position: absolute; top: 50%; border-radius: 12px; transform: translateY(-50%); box-shadow: 0 0 30px rgba(233,69,96,0.5); }
  .counter { position: absolute; top: 30px; right: 40px; font-size: 64px; font-weight: bold; color: #4ecca3; }
  .clock { position: absolute; bottom: 30px; right: 40px; font-size: 48px; color: #e2e2e2; }
  .label { position: absolute; top: 10px; right: 40px; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 2px; }
  .clock-label { position: absolute; bottom: 10px; right: 40px; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 2px; }
  .title { position: absolute; top: 30px; left: 40px; font-size: 20px; color: #888; }
  #fps { position: absolute; top: 100px; left: 40px; font-size: 28px; color: #0f0; }
</style>
</head>
<body>
<div class="title">CDP Screencast FPS Test</div>
<div class="label">FRAME COUNT</div>
<div class="counter" id="counter">0</div>
<div class="clock-label">CLOCK</div>
<div class="clock" id="clock"></div>
<div id="fps">FPS: 0</div>
<div class="box" id="box"></div>

<script>
  const box = document.getElementById('box');
  const counterEl = document.getElementById('counter');
  const clockEl = document.getElementById('clock');
  const fpsEl = document.getElementById('fps');

  let frameCount = 0;
  let x = 0;
  let dir = 1;
  const speed = 3;

  let fpsCounter = 0;
  let lastFpsUpdate = performance.now();

  function animate() {
    frameCount++;
    counterEl.textContent = frameCount;

    x += speed * dir;
    if (x > window.innerWidth - 120) { dir = -1; box.style.background = 'linear-gradient(135deg, #4ecca3, #45b7d1)'; }
    if (x < 0) { dir = 1; box.style.background = 'linear-gradient(135deg, #e94560, #ff6b6b)'; }
    box.style.left = x + 'px';

    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: false });

    fpsCounter++;
    const t = performance.now();
    if (t - lastFpsUpdate >= 1000) {
      fpsEl.textContent = 'FPS: ' + Math.round(fpsCounter / ((t - lastFpsUpdate) / 1000));
      fpsCounter = 0;
      lastFpsUpdate = t;
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
